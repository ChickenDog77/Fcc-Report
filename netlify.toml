[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ehkfjlvufxrwtkomcqur.supabase.co; img-src 'self' data: https://api.qrserver.com; frame-ancestors 'none'"

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/:church/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/:church/:room"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:church"
  to = "/index.html"
  status = 200
